# =============================================================================
# General
# =============================================================================

# Reset stale keybindings to tmux defaults before applying this config
run-shell 'tmux -f /dev/null -L temp start-server \; list-keys > /tmp/tmux_defaults && tmux unbind-key -a \; source-file /tmp/tmux_defaults'

# Use Ctrl+Space as prefix instead of Ctrl+B
set -g prefix C-space
unbind C-b
bind C-space send-prefix

# Start window and pane numbering at 1 (easier to reach on keyboard)
set -g base-index 1
set -g renumber-windows on

# Large scrollback buffer
set -g history-limit 1000000

# Mouse support
set -g mouse on

# Don't exit tmux when the last pane in a session is closed
set -g detach-on-destroy off

# Renumber sessions so unnamed sessions use the lowest available integer >= 1
set-hook -g after-new-session 'run-shell "$XDG_CONFIG_HOME/tmux/renumber-session.sh #{session_name}"'

# Name windows after the running command, except for Claude Code — its installer
# names the binary after the version (~/.local/share/claude/versions/2.1.220), so
# pane_current_command is a bare version string. Fall back to the pane title, which
# Claude sets to the conversation summary; strip its leading spinner glyph and clip
# to 22 chars. Manually renamed windows (automatic-rename off) are unaffected.
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{=22:#{s/^[^ ]* //:pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}"


# =============================================================================
# Extended Keys (CSI u)
# =============================================================================

set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'

# Shift+Enter — send CSI u sequence so terminals can distinguish it from plain Enter
bind -n S-Enter send-keys Escape "[13;2u"


# =============================================================================
# Key Bindings
# =============================================================================

bind ? list-keys

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing, alongside the default C-Up/Down/Left/Right.
# -r makes them repeatable within repeat-time, so C-h C-h C-h works off
# one prefix.
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Larger steps, alongside the default M-Up/Down/Left/Right.
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Open new windows/panes in the current working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Kill pane without confirmation prompt
bind x kill-pane

# Join another window into the current one as a side-by-side pane
bind J command-prompt -p "Join pane from window:" "join-pane -h -t '%%'"

# Create a named session
bind N command-prompt -p "New session name: " "new-session -s '%%'"

# Name the current pane (shown in the pane border title bar)
bind P command-prompt -p "Pane title: " "select-pane -T '%%'"

# Quicken window reordering
bind T command-prompt -p "Swap window with: " "swap-window -t '%%'"
bind -r S-Left swap-window -t -1 \; select-window -t -1
bind -r S-Right swap-window -t +1 \; select-window -t +1

# Toggle a yellow mark on the current window's tab
bind M if -F '#{@marked}' \
  'set -wu @marked ; set -wu window-status-style ; set -wu window-status-current-style' \
  'set -w @marked 1 ; set -w window-status-style bg=yellow,fg=black ; set -w window-status-current-style bg=yellow,fg=black'

# Set the current window's tab color (blank clears it)
bind B command-prompt -p "Tab color:" {
  if -F "#{==:%%,}" {
    set -wu window-status-style ; set -wu window-status-current-style
  } {
    set -w window-status-style "bg=%%,fg=black" ; set -w window-status-current-style "bg=%%,fg=black"
  }
}

# Ctrl+L clears the screen and tmux scrollback history
bind -n C-l send-keys C-l \; clear-history

# =============================================================================
# Copy Mode
# =============================================================================

# Copy mode with line numbers
bind C-[ run-shell "~/.config/tmux/copy_mode_with_line_numbers.sh"

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# =============================================================================
# Appearance
# =============================================================================

set -g status-bg colour233
set -g message-style "fg=colour233,bg=colour75,fill=colour75"
set -g status-left-length 100

# tmux 3.8 changed the popup default to a grey theme background; use the terminal background
set -g popup-style default
set -g popup-border-style default

# Show a title bar on pane borders, but only once a window is split 
# Right-align the pane title
setw -g pane-border-format '#[align=right] #{?pane_active,#[reverse],}#{pane_index}#[default] "#{pane_title}" '
set-hook -g window-layout-changed 'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
set-hook -g window-pane-changed  'if -F "#{==:#{window_panes},1}" "setw pane-border-status off" "setw pane-border-status top"'
setw -g pane-border-style fg=colour242

# =============================================================================
# Sesh (session manager with fzf)
# =============================================================================

# S — fuzzy-pick and connect to a sesh session
bind C-s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 100%,100% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# W — fuzzy-pick a sesh window
bind C-w run-shell "sesh window \"$(sesh window | fzf-tmux -p 100%,100% --prompt '🪟  ')\""


# =============================================================================
# Plugins (TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'laktak/extrakto'
set -g @extrakto_popup_size "100%,100%"
set -g @minimal-tmux-justify "absolute-centre"
set -g @minimal-tmux-indicator-str "#($XDG_CONFIG_HOME/tmux/git_or_tmux.sh)"
set -g @agent-indicator-done-window-title-bg "yellow"
set -g @agent-indicator-done-window-title-fg "black"
set -g @agent-indicator-notification-enabled "off"

# Keep TPM-installed plugins out of the dotfiles config dir.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins/"

# Initialize TPM — keep this at the very bottom
run '$XDG_DATA_HOME/tmux/plugins/tpm/tpm'
